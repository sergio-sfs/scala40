<body>
<div id="app"></div>
<script>
/*ENGINE*/
const SUITS=['♠','♥','♦','♣'],RED=[false,true,true,false];
let SPEED=1;const sleep=ms=>new Promise(r=>setTimeout(r,ms*SPEED));
let uid=0;
function makeDeck(){const nd=OPT.decks===3?3:2,d=[];for(let k=0;k<nd;k++)for(let s=0;s<4;s++)for(let r=1;r<=13;r++)d.push({id:uid++,s,r});for(let j=0;j<4+2*(nd-2);j++)d.push({id:uid++,s:-1,r:0,j:true});return d;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const rk=p=>(p===14||p===1)?'A':p===11?'J':p===12?'Q':p===13?'K':String(p);
const posVal=p=>p===14?11:p===1?1:Math.min(p,10);
const penalty=c=>c.j?25:c.r===1?11:Math.min(c.r,10);
const RU=()=>(G&&G.rules)||OPT.rl,OPEN=()=>RU().open||40,PEN0=()=>{const p=RU().pen;return p===1?50:p===2?'hand':100;};
const cs=c=>c.j?'il Jolly':rk(c.r)+SUITS[c.s];

// Valuta un gruppo di carte: ritorna {type,pts,cards:[{c,p}]} oppure null
// Tutte le disposizioni valide di un gruppo di carte (la prima e' quella predefinita)
function evalAll(cards){
  const n=cards.length;if(n<3)return[];
  const jk=cards.filter(c=>c.j),rl=cards.filter(c=>!c.j);
  if(jk.length>1||rl.length<2)return[];
  if(n<=4&&rl.every(c=>c.r===rl[0].r)&&new Set(rl.map(c=>c.s)).size===rl.length){
    const r=rl[0].r,v=r===1?11:Math.min(r,10);
    const mk=su=>({type:'set',pts:v*n,cards:[...rl,...jk].map(c=>({c,p:r,su:c.j?su:undefined}))});
    if(!jk.length)return[mk()];
    // seme del jolly: predefinito "come quando fuori piove" (quadri chiama fiori, picche chiama cuori)
    const have=new Set(rl.map(c=>c.s)),miss=[0,1,2,3].filter(x=>!have.has(x)),pair={2:3,0:1,3:2,1:0};
    let su=miss[0];
    if(miss.length>1)for(const x of[2,0,3,1])if(have.has(x)&&miss.includes(pair[x])){su=pair[x];break;}
    return[su,...miss.filter(x=>x!==su)].map(mk);
  }
  const suit=rl[0].s;if(!rl.every(c=>c.s===suit))return[];
  const out=[],seen=new Set();
  for(const hi of(RU().ace===1?[false]:[false,true])){
    const lo=hi?2:1,up=hi?14:13;
    const ps=rl.map(c=>c.r===1?(hi?14:1):c.r);
    if(new Set(ps).size!==ps.length)continue;
    const mn=Math.min(...ps),mx=Math.max(...ps);
    const gaps=(mx-mn+1)-rl.length,jleft=jk.length-gaps;
    if(jleft<0)continue;
    const opts=[];
    if(jleft===0)opts.push([mn,mx]);
    else{if(mx+1<=up)opts.push([mn,mx+1]);if(mn-1>=lo)opts.push([mn-1,mx]);}
    for(const[a,b]of opts){
      if(b-a+1!==n)continue;
      const m=new Map(ps.map((p,i)=>[p,rl[i]]));
      const seq=[];let pts=0,key='';
      for(let p=a;p<=b;p++){const jj=!m.has(p);seq.push({c:jj?jk[0]:m.get(p),p,su:jj?suit:undefined});pts+=posVal(p);key+=p+(jj?'J':'')+',';}
      if(seen.has(key))continue;seen.add(key);
      out.push({type:'run',pts,cards:seq});
    }
  }
  return out.sort((x,y)=>y.pts-x.pts);
}
function evalMeld(cards){return evalAll(cards)[0]||null;}

function subsets(av){const out=[],n=av.length;for(let m=1;m<(1<<n);m++){const s=[];for(let i=0;i<n;i++)if(m&(1<<i))s.push(av[i]);if(s.length>=2)out.push(s);}return out;}

// Trova la miglior combinazione di gruppi disgiunti nella mano (per i bot)
function solve(hand,must,cap,opt){
  cap=cap||150000;
  const cnt=Array.from({length:4},()=>Array(15).fill(0)),inst={},jokers=[];
  for(const c of hand){if(c.j)jokers.push(c);else{cnt[c.s][c.r]++;(inst[c.s+'-'+c.r]=inst[c.s+'-'+c.r]||[]).push(c);}}
  const jn=jokers.length,shapes=[];
  for(let r=1;r<=13;r++){
    const av=[0,1,2,3].filter(s=>cnt[s][r]>0),v=r===1?11:Math.min(r,10);
    for(const sub of subsets(av)){
      if(sub.length>=3)shapes.push({items:sub.map(s=>[s,r]),j:0,pts:v*sub.length});
      if(sub.length<=3&&jn>0)shapes.push({items:sub.map(s=>[s,r]),j:1,pts:v*(sub.length+1)});
    }
  }
  for(let s=0;s<4;s++)for(let a=1;a<=14;a++)for(let b=a+2;b<=14;b++){
    if(b-a+1>13)continue;
    let miss=0,pts=0;const items=[];
    for(let p=a;p<=b;p++){const r=p===14?1:p;if(cnt[s][r]>0)items.push([s,r]);else miss++;pts+=posVal(p);}
    if(miss>1||(miss===1&&jn===0)||items.length<2)continue;
    shapes.push({items,j:miss,pts});
  }
  const hasMust=sel=>!must||sel.some(sh=>must.j?sh.j>0:sh.items.some(([s,r])=>s===must.s&&r===must.r));
  let best=null,nodes=0;const used=[];
  (function dfs(i,pts,ju,cc){
    if(++nodes>cap)return;
    if(used.length&&hasMust(used)&&(!opt||(pts>=(opt.minPts||0)&&cc<=(opt.maxCards||99)))){
      const better=!best||(opt&&opt.cards?(cc>best.cc||(cc===best.cc&&pts>best.pts)):pts>best.pts);
      if(better)best={pts,cc,sel:used.slice()};
    }
    for(let k=i;k<shapes.length;k++){
      const sh=shapes[k];if(ju+sh.j>jn)continue;
      let ok=true;
      for(const[s,r]of sh.items){cnt[s][r]--;if(cnt[s][r]<0)ok=false;}
      const n=sh.items.length+sh.j;
      if(ok&&!(opt&&cc+n>(opt.maxCards||99))){used.push(sh);dfs(k,pts+sh.pts,ju+sh.j,cc+n);used.pop();}
      for(const[s,r]of sh.items)cnt[s][r]++;
    }
  })(0,0,0,0);
  if(!best)return null;
  const pool={};for(const k in inst)pool[k]=inst[k].slice();const jp=jokers.slice();
  const melds=best.sel.map(sh=>{const cs_=sh.items.map(([s,r])=>pool[s+'-'+r].pop());for(let q=0;q<sh.j;q++)cs_.push(jp.pop());return cs_;});
  return{melds,pts:best.pts};
}

function pickDiscard(hand,danger,rnd){
  if(rnd&&Math.random()<rnd){const cand=hand.filter(c=>!c.j&&(hand.length<=1||!tryAttach(c)));if(cand.length)return cand[Math.floor(Math.random()*cand.length)];}
  let best=null,bs=1e9;
  for(const c of hand){
    if(c.j)continue;
    if(hand.length>1&&tryAttach(c))continue;
    let sc=0;
    for(const d of hand){
      if(d===c||d.j)continue;
      if(d.r===c.r)sc+=d.s!==c.s?3:0.5;
      else if(d.s===c.s){const df=Math.abs(d.r-c.r);if(df===1)sc+=3;else if(df===2)sc+=1.5;else if(df===12)sc+=3;else if(df===11)sc+=1.5;}
    }
    if(danger&&danger(c))sc+=4;
    sc-=penalty(c)*0.05;
    if(sc<bs){bs=sc;best=c;}
  }
  return best||hand[0];
}

/* ===== Stato di gioco ===== */
let G=null,ON=null;const UI={menu:false,rules:false,vars:false};
const H=()=>G.players[0];
function ownTags(){const ps=G.players,t=ps.map((p,i)=>{for(let n=1;n<=3;n++){const x=p.name.slice(0,n).toUpperCase();if(!ps.some((q,j)=>j!==i&&q.name.toUpperCase().startsWith(x)))return x;}return null;});return t.map((x,i)=>x||ps[i].name[0].toUpperCase()+(i+1));}
const say=(m,err)=>{G.msg=m;G.err=!!err;};
const nextActive=i=>{let j=i;do{j=(j+1)%G.players.length;}while(G.players[j].out);return j;};
const sumPen=h=>h.reduce((s,c)=>s+penalty(c),0);
const BOTS=['Anna','Bruno','Carla','Dario','Elena','Fabio','Giulia','Marta','Nadia','Paolo','Rita','Sandro','Teresa','Ugo','Vera','Enzo','Irene','Gino','Silvia','Renzo','Chiara','Mauro'];

function startGame(n,allBots,pre){
  G={players:[{name:'Tu',human:!allBots,hand:[],opened:false,score:0,out:false}],stock:[],discard:[],melds:[],pending:[],sel:new Set(),
     rules:Object.assign({},OPT.rl),turn:0,phase:'wait',mustUse:null,newId:null,msg:'',err:false,round:0,dealer:n,sortMode:0,over:false,rows:null,turns:0,target:TARGETV[OPT.game]};
  const bn=shuffle(BOTS.filter(x=>!(ON&&ON.nicks&&ON.nicks.includes(x))));
  for(let i=0;i<n;i++)G.players.push({name:bn[i],human:false,hand:[],opened:false,score:0,out:false});
  UI.menu=false;UI.rules=false;
  if(pre)pre(G);
  newRound();
}
function newRound(){
  G.stock=shuffle(makeDeck());G.discard=[];G.melds=[];G.pending=[];G.sel=new Set();G.mustUse=null;G.newId=null;G.rows=null;G.turns=0;G.taken=[];
  for(const p of G.players){p.hand=[];p.opened=false;p.inRound=!p.out;}
  for(const p of G.players)if(!p.out)for(let i=0;i<13;i++)p.hand.push(G.stock.pop());
  G.discard.push(G.stock.pop());
  if(G.round>0)G.dealer=nextActive(G.dealer);
  G.round++;G.turn=nextActive(G.dealer);
  if(G.players[0].human)sortHand();
  startTurn();
}
function sortHand(){
  const key=c=>c.j?[9,99]:(G.sortMode===0?[c.s,c.r]:[c.r,c.s]);
  H().hand.sort((a,b)=>{const x=key(a),y=key(b);return x[0]-y[0]||x[1]-y[1];});
}
function drawStock(){
  if(!G.stock.length){
    if(G.discard.length>1){const top=G.discard.pop();G.stock=shuffle(G.discard);G.discard=[top];}
    else return null;
  }
  return G.stock.pop();
}
async function startTurn(){
  const g=G;
  if(++G.turns>400){endRound(-1);return;}
  const p=G.players[G.turn];
  if(ON&&ON.role==='host')hostSave();
  G.sel.clear();G.mustUse=null;G.acted=false;
  if(p.remote){if(p.conn){G.phase='wait';say(p.name+' sta giocando…');render();sendTurn(G.turn);}else awayTurn(G.turn);return;}
  if(p.human){G.phase='draw';say('Tocca a te: pesca dal mazzo o prendi lo scarto.');render();return;}
  G.phase='wait';say(p.name+' sta giocando…');render();
  await sleep(700);if(G!==g)return;
  await botTurn(G.turn,g);
}
function endTurn(){G.turn=nextActive(G.turn);if(ON&&ON.role==='client'){clearTimeout(ON.ct);sendUpd({done:true});G.phase='wait';say('Turno finito. Attendi gli altri…');render();return;}startTurn();}

function endRound(closer){
  if(G.pending.length){for(const e of G.pending)H().hand.push(...e.cards.map(x=>x.c));G.pending=[];}
  if(ON&&ON.role==='client'){clearTimeout(ON.ct);sendUpd({close:true,closer});G.phase='wait';render();return;}
  G.phase='roundEnd';const rows=[];
  G.players.forEach((p,i)=>{
    if(!p.inRound)return;
    const pts=i===closer?0:(closer===-1?sumPen(p.hand):(p.opened?sumPen(p.hand):(PEN0()==='hand'?sumPen(p.hand):PEN0())));
    p.score+=pts;if(G.target>0&&p.score>=G.target)p.out=true;
    rows.push({name:p.name,pts,score:p.score,out:p.out,opened:p.opened,closer:i===closer});
  });
  G.rows=rows;G.closer=closer;
  const act=G.players.filter(p=>!p.out);
  if(G.target===0||act.length<=1||(!ON&&G.players[0].out)){
    G.over=true;
    const pool=act.length?act:G.players;
    G.winner=pool.slice().sort((a,b)=>a.score-b.score)[0].name;
  }
  if(ON&&ON.role==='host'){if(G.over)hostDrop();else hostSave();}
  render();
}

/* ===== Bot ===== */
function tryAttach(card){
  for(let i=0;i<G.melds.length;i++){
    const m=G.melds[i],ev=evalMeld(m.cards.map(x=>x.c).concat([card]));
    if(ev&&ev.type===m.type)return{i,ev};
  }
  return null;
}
// Livelli: take/lay/attach = probabilita' di prendere lo scarto utile / calare / attaccare, rnd = probabilita' di scarto a caso,
// swap = scambia i jolly dal tavolo, avoid = evita di scartare carte utili agli avversari, deepM = cala il massimo numero di carte
const LV=[{take:.3,lay:.55,attach:.4,rnd:.65,swap:false,avoid:false,deepM:false},{take:.55,lay:.75,attach:.6,rnd:.4,swap:false,avoid:false,deepM:false},{take:.75,lay:.9,attach:.75,rnd:.25,swap:true,avoid:false,deepM:false},{take:1,lay:1,attach:1,rnd:0,swap:true,avoid:true,deepM:true}];
const dangerFor=i=>c=>G.taken.some(t=>t.by!==i&&!t.card.j&&(t.card.r===c.r||(t.card.s===c.s&&Math.abs(t.card.r-c.r)<=2)));
async function botTurn(i,g){
  const P=G.players[i],LVL=LV[P.lvl!==undefined?P.lvl:OPT.diff];const acts=[];
  const top=G.discard[G.discard.length-1];
  let took=false,must=null;
  if(top){
    must=top.j?{j:true}:{s:top.s,r:top.r};
    const sol=solve(P.hand.concat([top]),must);
    if(sol&&(P.opened||sol.pts>=OPEN())&&Math.random()<LVL.take){G.discard.pop();G.taken.push({by:i,card:top});P.hand.push(top);took=true;acts.push('prende '+cs(top)+' dallo scarto');}
  }
  if(!took){const c=drawStock();if(!c){endRound(-1);return;}P.hand.push(c);acts.push('pesca dal mazzo');}
  say(P.name+' '+acts[0]+'.');render();await sleep(800);if(G!==g)return;
  if(P.opened&&LVL.swap){
    let sw=0,again2=true;
    while(again2){
      again2=false;
      for(let k=0;k<G.melds.length&&!again2;k++){
        const m=G.melds[k];if(!m.cards.some(x=>x.c.j))continue;
        for(const c of P.hand){
          const r=jokerSwap(m,c);
          if(r){m.cards=r.ev.cards;m.pts=r.ev.pts;P.hand=P.hand.filter(x=>x.id!==c.id);P.hand.push(r.joker);sw++;again2=true;break;}
        }
      }
    }
    if(sw){say(P.name+' prende '+(sw===1?'un jolly':sw+' jolly')+' dal tavolo.');render();await sleep(900);if(G!==g)return;}
  }
  const sol=LVL.deepM?solve(P.hand,took?must:null,0,{cards:true,minPts:P.opened?0:OPEN(),maxCards:P.hand.length-1}):solve(P.hand,took?must:null);
  if(sol&&(P.opened||sol.pts>=OPEN())&&(took||Math.random()<LVL.lay)){
    let melds=sol.melds.slice();
    if(melds.reduce((a,m)=>a+m.length,0)>=P.hand.length){
      const k=melds.findIndex(m=>m.length>3);
      if(k>=0){for(let q=0;q<melds[k].length;q++){const t=melds[k].filter((_,x)=>x!==q);if(evalMeld(t)){melds[k]=t;break;}}}
      else melds.pop();
    }
    const tot=melds.reduce((a,m)=>{const e=evalMeld(m);return a+(e?e.pts:0);},0);
    if(!P.opened&&tot<OPEN())melds=[];
    let n=0;
    for(const m of melds){
      const ev=evalMeld(m);if(!ev)continue;
      const ids=new Set(m.map(c=>c.id));P.hand=P.hand.filter(c=>!ids.has(c.id));
      G.melds.push({owner:i,...ev});n++;
    }
    if(n){P.opened=true;acts.push(n===1?'cala una combinazione':'cala '+n+' combinazioni');say(P.name+' '+acts[acts.length-1]+'.');render();await sleep(900);if(G!==g)return;}
  }
  if(P.opened){
    let again=true,att=0;
    while(again&&P.hand.length>1){
      again=false;
      for(const c of P.hand.slice()){
        if(c.j||P.hand.length<=1)continue;
        const a=Math.random()<LVL.attach?tryAttach(c):null;
        if(a){G.melds[a.i].cards=a.ev.cards;G.melds[a.i].pts=a.ev.pts;P.hand=P.hand.filter(x=>x.id!==c.id);att++;again=true;break;}
      }
    }
    if(att){say(P.name+' attacca '+att+(att===1?' carta':' carte')+'.');render();await sleep(800);if(G!==g)return;}
  }
  if(!P.hand.length){say(P.name+' chiude la mano!');endRound(i);return;}
  const d=pickDiscard(P.hand,LVL.avoid?dangerFor(i):null,LVL.rnd);
  P.hand=P.hand.filter(c=>c.id!==d.id);G.discard.push(d);
  if(!P.hand.length){endRound(i);return;}
  say(P.name+' scarta '+cs(d)+'.');render();await sleep(500);if(G!==g)return;
  endTurn();
}

function coachHint(){
  const me=H(),hand=me.hand,top=G.discard[G.discard.length-1];
  if(G.phase==='draw'){
    if(!top)return{text:'💡 Pesca dal mazzo.'};
    const must=top.j?{j:true}:{s:top.s,r:top.r};
    const sol=solve(hand.concat([top]),must);
    const free=OPT.rule===2||(OPT.rule===1&&me.opened);
    if(sol&&(me.opened||sol.pts>=OPEN()))return{text:'💡 Prendi lo scarto ('+cs(top)+'): con quella carta puoi calare '+sol.pts+' punti.'};
    if(me.opened&&free&&!top.j&&tryAttach(top))return{text:'💡 Prendi lo scarto ('+cs(top)+'): si attacca a una combinazione sul tavolo.'};
    return{text:'💡 Pesca dal mazzo: lo scarto ('+cs(top)+') non ti aiuta a calare combinazioni'+(me.opened?'.':' da '+OPEN()+' punti.')};
  }
  if(G.phase!=='play')return{text:''};
  const forced=G.mustUse!==null&&!G.acted?hand.find(c=>c.id===G.mustUse):null;
  if(me.opened){
    for(const m of G.melds){if(!m.cards.some(x=>x.c.j))continue;
      for(const c of hand){if(jokerSwap(m,c))return{text:'💡 Puoi prendere un jolly dal tavolo: seleziona '+cs(c)+' e poi tocca la combinazione con il jolly.',sel:[c.id]};}}
  }
  const must=forced?(forced.j?{j:true}:{s:forced.s,r:forced.r}):null;
  const sol=solve(hand,must,0,{cards:true,minPts:me.opened?0:OPEN(),maxCards:hand.length-1});
  if(sol&&(me.opened||sol.pts>=OPEN())&&sol.melds.length){
    const first=sol.melds[0],rest=sol.melds.length-1;
    return{text:'💡 '+(me.opened?'Puoi calare: ':'Puoi aprire! ')+'seleziona le carte evidenziate e premi Cala ('+sol.pts+' punti in tutto'+(rest?', poi le altre '+rest+' combinazioni':'')+').',sel:first.map(c=>c.id)};
  }
  if(forced&&!G.acted)return{text:'💡 Con lo scarto che hai preso non riesci a fare una combinazione: premi ↩ per rimetterlo e pescare dal mazzo.'};
  if(me.opened&&hand.length>1){
    for(const c of hand){if(!c.j&&tryAttach(c))return{text:'💡 Puoi attaccare '+cs(c)+' a una combinazione sul tavolo: selezionala e tocca la combinazione.',sel:[c.id]};}
  }
  const d=pickDiscard(hand,dangerFor(0),0);
  return{text:'💡 '+(me.opened?'':'Non puoi ancora aprire (servono '+OPEN()+' punti). ')+'Scarta '+cs(d)+': è la carta che ti serve meno e che aiuta meno gli avversari.',sel:[d.id]};
}
function jokerSwap(m,card){
  if(RU().swap===false)return null;
  const ji=m.cards.findIndex(x=>x.c.j);if(ji<0||card.j)return null;
  const jt=m.cards[ji],real=m.cards.filter(x=>!x.c.j).map(x=>x.c);
  if(m.type==='set'){if(card.r!==jt.p||real.some(c=>c.s===card.s))return null;}
  else{if(card.s!==real[0].s||card.r!==(jt.p===14?1:jt.p))return null;}
  const ev=evalMeld([...real,card]);
  return ev&&ev.type===m.type?{ev,joker:jt.c}:null;
}
function doSwap(i){

  me.hand=me.hand.filter(c=>c.id!==card.id);me.hand.push(sw.joker);

}
function doAttach(i){

  if(!ev||ev.type!==m.type){toast(picked.length>1?'Queste carte non si attaccano qui.':'Questa carta non si attacca qui.');return;}
  if(picked.length>=me.hand.length){toast('Devi tenere almeno una carta da scartare: si chiude con lo scarto.');return;}
  G.acted=true;m.cards=ev.cards;m.pts=ev.pts;me.hand=me.hand.filter(c=>!G.sel.has(c.id));G.sel.clear();

}

function act(a,d){
  if(a==='start'){startGame(+d.n);return;}
  if(a==='rules'){UI.rules=!UI.rules;render();return;}
  if(a==='menu'){UI.menu=!UI.menu;render();return;}
  if(a==='vars'){UI.vars=!UI.vars;render();return;}
  if(a==='vopen'||a==='vace'||a==='vpen'||a==='vswap'){const r=OPT.rl;if(a==='vopen')r.open=r.open===40?51:40;else if(a==='vace')r.ace=1-r.ace;else if(a==='vpen')r.pen=(r.pen+1)%3;else r.swap=!r.swap;try{localStorage.setItem('scala40opt',JSON.stringify(OPT));}catch(e){}render();return;}
  if(a==='optsize'||a==='optrule'||a==='optgame'||a==='optdiff'){const k={optsize:'size',optrule:'rule',optgame:'game',optdiff:'diff'}[a];OPT[k]=(OPT[k]+1)%({size:5,rule:3,game:4,diff:4}[k]);try{localStorage.setItem('scala40opt',JSON.stringify(OPT));}catch(e){}render();return;}
  if(a==='optcards'){OPT.cards=(OPT.cards+1)%3;try{localStorage.setItem('scala40opt',JSON.stringify(OPT));}catch(e){}render();return;}
  if(a==='optdecks'){OPT.decks=OPT.decks===3?2:3;try{localStorage.setItem('scala40opt',JSON.stringify(OPT));}catch(e){}render();return;}
  if(a==='optnet'){OPT.net=NEXTNET[OPT.net]||'p2p';try{localStorage.setItem('scala40opt',JSON.stringify(OPT));}catch(e){}render();return;}
  if(a==='hint'){if(ON)return;OPT.coach=!OPT.coach;try{localStorage.setItem('scala40opt',JSON.stringify(OPT));}catch(e){}render();return;}
  if(a==='spread'){OPT.spread=!OPT.spread;try{localStorage.setItem('scala40opt',JSON.stringify(OPT));}catch(e){}render();return;}
  if(/^(online|oback|ocreate|ojoin|oseats|ograce|ostart|oshare|onet|oresume|odrop|orejoin|olast)$/.test(a)){onAct(a);return;}
  if(a==='newgame'){if(ON)leaveOnline();G=null;UI.menu=false;if(tryUpd())return;render();return;}
  if(a==='exit'){if(ON)leaveOnline();G=null;UI.menu=false;if(tryUpd())return;render();return;}
  if(a==='next'){if(ON&&ON.role==='client')return;newRound();return;}
  if(!G||G.turn!==0||G.phase==='wait'||G.phase==='roundEnd')return;
  const me=H();
  switch(a){
    case'stock':{
      if(G.phase!=='draw')return;
      if(ON&&ON.role==='client'){if(ON.wd)return;ON.wd=true;try{ON.conn.send({t:'draw'});}catch(e){ON.wd=false;}return;}
      const c=drawStock();if(!c){endRound(-1);return;}
      me.hand.push(c);G.newId=c.id;G.phase='play';say('Hai pescato '+cs(c)+'. Cala, attacca o scarta.');render();break;}
    case'disc':{
      if(G.phase!=='draw')return;
      const top=G.discard[G.discard.length-1];if(!top)return;
      const free=OPT.rule===2||(OPT.rule===1&&me.opened);
      G.discard.pop();G.taken.push({by:0,card:top});me.hand.push(top);G.mustUse=free?null:top.id;G.newId=free?top.id:null;G.phase='play';G.acted=false;
      say(free?'Hai preso '+cs(top)+': puoi tenerlo in mano.':'Hai preso '+cs(top)+': usalo in una combinazione, oppure premi ↩ per rimetterlo e pescare dal mazzo.');render();break;}
    case'putback':{
      if(G.phase!=='play'||G.mustUse===null||G.acted||!me.hand.some(c=>c.id===G.mustUse)){toast('Non puoi più rimetterlo a posto.');return;}
      for(const e of G.pending)me.hand.push(...e.cards.map(x=>x.c));

    case'open':{

    case'meld':{
      if(G.phase!=='play')return;
      if(!me.opened){toast('Devi prima aprire con '+OPEN()+' punti.');return;}
      if(!G.sel.size){toast('Seleziona le carte da attaccare (o la carta che sostituisce un jolly).');return;}
      const picked=me.hand.filter(c=>G.sel.has(c.id)),m=G.melds[+d.i];
      const sw=picked.length===1?jokerSwap(m,picked[0]):null;

      say('Hai scartato '+cs(card)+'.');G.newId=null;endTurn();break;}
  }
}

const _b64=u=>{let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t);};

async function mqKeys(code){
  const h=async t=>new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t))),k=getKey().trim().toLowerCase();
  const root=Array.from((await h('t|'+k+'|'+code)).slice(0,10)).map(x=>x.toString(16).padStart(2,'0')).join('');
  return{root:'scala40/'+root,key:await crypto.subtle.importKey('raw',await h('k|'+k+'|'+code),'AES-GCM',false,['encrypt','decrypt'])};
}
async function zip(u,en){const cs=en?new CompressionStream('deflate'):new DecompressionStream('deflate'),w=cs.writable.getWriter();w.write(u);w.close();return new Uint8Array(await new Response(cs.readable).arrayBuffer());}

let NTFYS=['https://ntfy.sh/'],NT_COAL=2500,NT_BURST=40,NT_REFILL=6000;
const _sl=ms=>new Promise(r=>setTimeout(r,ms));
class NtfyClient{
  constructor(base){this.base=base;this.h={};this.connected=false;this.reconnecting=true;this.ended=false;this.topic=null;this.subcb=[];this.asm={};this.q=[];this.busy=false;this.tok=NT_BURST;this.tt=Date.now();setTimeout(()=>this.emit('connect'),0);}

  emit(e,a,b){(this.h[e]||[]).slice().forEach(f=>f(a,b));}
  subscribe(topic,o,cb){if(!this.topic){this.topic=String(topic).replace(/\//g,'-');this._loop();}if(cb){if(this.connected)cb(null);else this.subcb.push(cb);}}
  async _loop(){
    while(!this.ended){
      const ac=new AbortController();this.ac=ac;
      try{
        const r=await fetch(this.base+this.topic+'/json',{signal:ac.signal});
        if(!r.ok)throw new Error('http'+r.status);
        const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
        for(;;){const x=await rd.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){const ln=buf.slice(0,i);buf=buf.slice(i+1);if(ln.trim())this._line(ln);}}
      }catch(e){}
      if(this.ended)return;
      this.connected=false;this.reconnecting=true;this.emit('close');
      await _sl(2000);
    }
  }
  _line(l){let o;try{o=JSON.parse(l);}catch(e){return;}
    if(o.event==='open'){if(!this.connected){this.connected=true;this.reconnecting=false;const c=this.subcb;this.subcb=[];c.forEach(f=>f(null));this.emit('connect');}return;}

  _chunk(o){
    const m=/^([A-Za-z0-9]{6})~(\d+)~(\d+)~/.exec(o.message);if(!m)return;
    const id=m[1],i=+m[2],n=+m[3],d=o.message.slice(m[0].length),now=Date.now();
    if(n===1){this.emit('message',o.topic,d);return;}
    for(const k in this.asm)if(now-this.asm[k].t>300000)delete this.asm[k];
    const a=this.asm[id]||(this.asm[id]={p:[],c:0,t:now});if(!a.p[i]){a.p[i]=d;a.c++;}
    if(a.c===n){delete this.asm[id];this.emit('message',o.topic,a.p.join(''));}
  }
  publish(topic,payload){
    const t=String(topic).replace(/\//g,'-'),n=Math.ceil(payload.length/3000)||1,id=Math.random().toString(36).slice(2,8).padEnd(6,'0');
    for(let i=0;i<n;i++)this.q.push({t,p:id+'~'+i+'~'+n+'~'+payload.slice(i*3000,(i+1)*3000),e:0});

  }
  async _drain(){
    if(this.busy)return;this.busy=true;
    while(this.q.length&&!this.ended){
      const now=Date.now();this.tok=Math.min(NT_BURST,this.tok+(now-this.tt)/NT_REFILL);this.tt=now;
      if(this.tok<1){await _sl((1-this.tok)*NT_REFILL);continue;}

      try{const r=await fetch(this.base+m.t,{method:'POST',body:m.p});
        if(r.status===429){this.tok=0;this.tt=Date.now();await _sl((+r.headers.get('retry-after')||10)*1000);continue;}
        this.q.shift();this.tok-=1;
      }catch(e){await _sl(2000);if(++m.e>5)this.q.shift();}
    }
    this.busy=false;
  }
  end(){this.ended=true;try{this.ac&&this.ac.abort();}catch(e){}}
  cut(){try{this.ac&&this.ac.abort();}catch(e){}}

}
class MqttConn{
  constructor(p,cid){this.p=p;this.cid=cid;this.h={};this.open=false;this.closed=false;this.out=0;this.inn=0;this.q=Promise.resolve();}
  on(e,f){(this.h[e]=this.h[e]||[]).push(f);}
  emit(e,a){(this.h[e]||[]).slice().forEach(f=>f(a));}
  _pub(env){const p=this.p;env.f=p.cid;this.q=this.q.then(async()=>{if(p.ended||!p.cl)return;const t=await mqEnc(p.K.key,env,p.slow);p.cl.publish(p.host?p.K.root+'/c/'+this.cid:p.K.root+'/h',t,{qos:1});}).catch(()=>{});}
  send(d){if(!this.open||this.closed)return;
    if(this.p.slow){
      if(d.t==='st'||(d.t==='upd'&&!d.done&&!d.close)){this.pend=d;if(!this.pt)this.pt=setTimeout(()=>this._flush(),NT_COAL);return;}
      if(this.pend){if(d.t==='turn'||d.t==='upd'){this.pend=null;clearTimeout(this.pt);this.pt=null;}else if(d.t==='draw'||d.t==='card'||d.t==='empty')this._flush();}
    }

  _flush(){clearTimeout(this.pt);this.pt=null;const d=this.pend;this.pend=null;if(d&&this.open&&!this.closed)this._pub({k:'d',n:++this.out,d});}
  close(){if(this.closed)return;this.closed=true;this.open=false;this.pend=null;clearTimeout(this.pt);this._pub({k:'x'});this.emit('close');}
  _gone(){if(this.closed)return;this.closed=true;this.open=false;this.emit('close');}
}
class MqttPeer{
  constructor(id,cd){
    this.h={};this.destroyed=false;this.ended=false;this.disconnected=false;this.opened=false;this.host=!!id;
    this.code=String(id||cd||'').replace(PFX,'');this.cid=this.host?'h':Math.random().toString(36).slice(2,10);
    this.conns={};this.bi=0;this.fails=0;this.rq=Promise.resolve();this.nt=!!(ON&&ON.net==='ntfy');this.slow=this.nt;
    (this.nt?(f=>f(true)):loadMqtt)(ok=>{if(this.destroyed)return;if(!ok){this._err('network');return;}mqKeys(this.code).then(K=>{if(this.destroyed)return;this.K=K;this._conn();}).catch(()=>this._err('network'));});
  }
  on(e,f){(this.h[e]=this.h[e]||[]).push(f);}
  emit(e,a){(this.h[e]||[]).slice().forEach(f=>f(a));}
  _err(t){this.emit('error',{type:t});}
  _conn(){
    const cl=this.nt?new NtfyClient(NTFYS[this.bi%NTFYS.length]):mqtt.connect(BROKERS[this.bi%BROKERS.length],{clientId:'s40'+Math.random().toString(36).slice(2,12),clean:true,reconnectPeriod:2000,connectTimeout:8000,keepalive:20});

      if(this.opened){if(!this.disconnected){this.disconnected=true;this.emit('disconnected');}return;}
      if(++this.fails>=2){this.fails=0;try{cl.end(true);}catch(e){}if(++this.bi>=(this.nt?NTFYS:BROKERS).length*2){this._err('network');return;}this._conn();}});
    cl.on('error',()=>{});
  }
  reconnect(){try{if(this.cl&&!this.destroyed&&!this.cl.connected&&!this.cl.reconnecting)this.cl.reconnect();}catch(e){}}
  _rx(m){
    if(this.host){

      if(m.k==='o'){if(!c||c.closed){c=new MqttConn(this,m.f);this.conns[m.f]=c;this.emit('connection',c);c.open=true;c._pub({k:'a'});c.emit('open');}else c._pub({k:'a'});return;}

      const c=this.conns.h;if(!c)return;
      if(m.k==='a'){if(!c.open&&!c.closed){c.open=true;c.emit('open');}return;}
      if(m.k==='x'){c._gone();return;}
      if(m.k==='d'&&c.open&&m.n>c.inn){c.inn=m.n;c.emit('data',m.d);}
    }
  }
  connect(id){
    const c=new MqttConn(this,'h');this.conns.h=c;let tries=0;

}

function onHost(nick,sv){

function mkPeer(reuse,tries){
  const code=reuse||({mqtt:'M',ntfy:'N'}[ON.net]||'')+Array.from({length:4},()=>CODEC[Math.random()*CODEC.length|0]).join('');
  const p=newPeer(PFX+code);ON.peer=p;
  p.on('open',()=>{if(!ON||ON.peer!==p)return;ON.code=code;if(ON.state==='starting'){if(ON.resume){const sv=ON.resume;ON.resume=null;hostRestore(sv);}else ON.state='lobby';render();}});
  p.on('disconnected',()=>{if(ON&&ON.peer===p&&!p.destroyed)setTimeout(()=>{try{p.reconnect();}catch(x){}},1500);});
  p.on('error',e=>{if(!ON||ON.peer!==p)return;
    if(e.type==='unavailable-id'){try{p.destroy();}catch(x){}if(reuse){if((tries||0)<40)setTimeout(()=>{if(ON&&ON.role==='host')mkPeer(reuse,(tries||0)+1);},2000);else onFail('Non riesco a riaprire la stanza.');}else mkPeer();return;}
    if(ON.state!=='starting'&&/network|server|socket|disconnected/.test(e.type)){setTimeout(()=>{try{p.reconnect();}catch(x){}},2000);return;}
    onFail('Errore di rete ('+e.type+').');});
  p.on('connection',c=>{c.on('data',m=>hostMsg(c,m));c.on('close',()=>hostLeft(c));c.on('error',()=>hostLeft(c));});
}
function lobbyBcast(){for(const nk of ON.nicks.slice(1)){try{ON.conns[nk].send({t:'lobby',players:ON.nicks,code:ON.code});}catch(e){}}}
function hostMsg(c,m){
  if(!ON||ON.role!=='host')return;
  if(m.t==='hello'&&ON.state==='playing'&&G){
    const nm=String(m.nick||'').slice(0,12),k=G.players.findIndex(p=>p.nick===nm&&p.wasHuman);
    if(k<1){try{c.send({t:'reject',why:'Partita già iniziata.'});}catch(e){}return;}
    const p=G.players[k],wasBot=!p.remote;
    try{p.conn&&p.conn!==c&&p.conn.close();}catch(e){}
    clearTimeout(ON.graceT&&ON.graceT[k]);
    p.remote=true;p.conn=c;c.nick=nm;c.last=Date.now();
    notify('✅ '+p.name+' è rientrato');
    if(G.turn===k&&G.phase!=='roundEnd'&&!wasBot){restoreSnap();say(p.name+' sta giocando…');sendTurn(k);}
    else try{c.send({t:'st',g:view(G,k),opt:{rule:OPT.rule}});}catch(e){}
    render();return;
  }
  if(m.t==='hello'){
    if(ON.state!=='lobby'||ON.nicks.length>=ON.seats){try{c.send({t:'reject',why:ON.state==='lobby'?'Stanza piena.':'Partita già iniziata.'});}catch(e){}return;}
    let nick=String(m.nick||'Ospite').slice(0,12),base=nick,i=2;
    while(ON.nicks.includes(nick)||nick==='Tu')nick=base+(i++);
    c.nick=nick;c.last=Date.now();ON.nicks.push(nick);ON.conns[nick]=c;lobbyBcast();notify('👋 '+nick+' è entrato');return;
  }
  c.last=Date.now();
  if(m.t==='ping'){try{c.send({t:'pong'});}catch(e){}return;}
  if(m.t==='draw'&&G){const k=G.players.findIndex(p=>p.conn===c);if(k>0&&G.turn===k&&G.phase!=='roundEnd'){const cd=drawStock();if(!cd){try{c.send({t:'empty'});}catch(e){}return;}G.players[k].hand.push(cd);try{c.send({t:'card',c:cd,disc:G.discard,n:G.stock.length});}catch(e){}}return;}
  if(m.t==='upd'&&G){const k=G.players.findIndex(p=>p.conn===c);if(k>0)applyUpd(k,m);}
}
function hostLeft(c){
  if(!ON||ON.role!=='host')return;
  if(ON.state==='lobby'&&c.nick){const had=ON.nicks.includes(c.nick);ON.nicks=ON.nicks.filter(x=>x!==c.nick);delete ON.conns[c.nick];lobbyBcast();if(had)notify('🚪 '+c.nick+' è uscito');else render();return;}
  if(!G)return;
  const k=G.players.findIndex(p=>p.conn===c);if(k<1)return;
  const p=G.players[k];p.conn=null;notify('⚠️ '+p.name+' si è scollegato');
  if(G.turn===k&&G.phase!=='roundEnd'){restoreSnap();awayTurn(k);}else render();
}
function awayTurn(k){
  const p=G.players[k];G.phase='wait';ON.snap=snapOf();ON.snapSeat=k;
  say(p.name+' è assente: lo aspetto '+ON.grace+' min…');render();
  ON.graceT=ON.graceT||{};clearTimeout(ON.graceT[k]);
  ON.graceT[k]=setTimeout(()=>{if(!ON||!G||p.conn)return;p.remote=false;if(G.turn===k&&G.phase!=='roundEnd'){restoreSnap();startTurn();}},ON.grace*60000);
}
const snapOf=()=>JSON.stringify({stock:G.stock,discard:G.discard,melds:G.melds,taken:G.taken,hands:G.players.map(p=>p.hand),op:G.players.map(p=>p.opened)});
function restoreSnap(){if(!ON.snap)return;const s=JSON.parse(ON.snap);G.stock=s.stock;G.discard=s.discard;G.melds=s.melds;G.taken=s.taken;G.players.forEach((p,i)=>{p.hand=s.hands[i];p.opened=s.op[i];});G.pending=[];}
function onStart(){
  if(!ON||ON.state!=='lobby'||ON.nicks.length<2)return;
  ON.state='playing';
  startGame(ON.seats-1,false,g=>{ON.nicks.slice(1).forEach((nk,i)=>{const p=g.players[i+1];p.name=nk;p.nick=nk;p.wasHuman=true;p.remote=true;p.conn=ON.conns[nk];});});
}
function vname(M,k,nm){const real=nm==='Tu'?ON.nicks[0]:nm;return real===(k===0?ON.nicks[0]:M.players[k].name)?'Tu':real;}
function view(M,k){
  const n=M.players.length,map=i=>(i-k+n)%n,mine=M.turn===k&&M.phase!=='roundEnd';
  const v=Object.assign({},M);
  v.players=M.players.map((_,j)=>{const o=M.players[(j+k)%n];return{name:j===0?'Tu':vname(M,k,o.name),human:j===0,opened:o.opened,score:o.score,out:o.out,inRound:o.inRound,hand:j===0?o.hand:o.hand.map((c,i)=>({id:-1000-j*100-i,s:0,r:1}))};});
  v.turn=map(M.turn);v.dealer=map(M.dealer);if(M.closer>=0)v.closer=map(M.closer);
  v.melds=M.melds.map(m=>Object.assign({},m,{owner:map(m.owner)}));
  v.rows=M.rows?M.rows.map(r=>Object.assign({},r,{name:vname(M,k,r.name)})):null;
  if(M.winner)v.winner=vname(M,k,M.winner);
  v.stock=new Array(M.stock.length).fill(0);
  v.cards=OPT.cards;
  v.sel=[];v.pending=[];v.taken=[];v.mustUse=null;v.newId=null;
  if(!mine&&M.phase!=='roundEnd'){v.phase='wait';v.msg=(M.turn===0?ON.nicks[0]:M.players[M.turn].name)+' sta giocando…';v.err=false;}
  return v;
}
function sendTurn(k){
  ON.snap=snapOf();ON.snapSeat=k;ON.takenBase=G.taken.slice();
  try{G.players[k].conn.send({t:'turn',g:view(G,k),opt:{rule:OPT.rule}});}catch(e){}
}
function bcast(){
  if(!ON||ON.role!=='host'||!G)return;
  G.players.forEach((p,k)=>{if(!p.remote||!p.conn)return;if(G.turn===k&&G.phase!=='roundEnd')return;try{p.conn.send({t:'st',g:view(G,k),opt:{rule:OPT.rule}});}catch(e){}});
}
function applyUpd(k,m){
  if(G.turn!==k||G.phase==='roundEnd')return;
  const v=m.g,n=G.players.length,un=i=>(i+k)%n;
  G.players[k].hand=v.players[0].hand;G.players[k].opened=v.players[0].opened;
  G.discard=v.discard;G.melds=v.melds.map(x=>Object.assign({},x,{owner:un(x.owner)}));
  G.taken=(ON.takenBase||[]).concat(v.taken.map(t=>({by:un(t.by),card:t.card})));
  if(m.close){endRound(m.closer===-1?-1:k);return;}
  if(m.done){G.turn=un(v.turn);startTurn();return;}
  render();
}
/* --- client --- */
function onJoin(nick,code){
  
  setTimeout(wake,0);
  ON={role:'client',state:'connecting',nick,code,err:'',players:[],lastRx:Date.now(),net:code.length===5?({M:'mqtt',N:'ntfy'}[code[0]]||'p2p'):'p2p'};render();
  ON.pt=setInterval(()=>{if(!ON||ON.role!=='client')return;if(ON.state==='reconnecting'||!ON.conn||!ON.conn.open){if(ON.state==='playing'||ON.state==='waiting')clientDown();return;}const nt=NT(),now=Date.now();if(now-ON.lastRx>nt.cdown){try{ON.conn.close();}catch(e){}clientDown();return;}if(now-(ON.lastPing||0)>=nt.ping-300){ON.lastPing=now;try{ON.conn.send({t:'ping'});}catch(e){}}},4000);
  loadPeer(ok=>{
    if(!ON||ON.role!=='client')return;
    if(!ok){onFail('Serve la connessione internet.');return;}
    const p=newPeer();ON.peer=p;
    p.on('open',()=>{
      if(!ON||ON.peer!==p)return;
      const c=p.connect(PFX+code,{reliable:true,serialization:'json'});ON.conn=c;
      const to=setTimeout(()=>onFail('Non riesco a collegarmi. Controlla codice e parola; con la rete mobile il collegamento diretto può essere bloccato dall\'operatore: chi crea la stanza può scegliere MQTT.'),15000);
      c.on('open',()=>{clearTimeout(to);c.send({t:'hello',nick});ON.state='waiting';lastSave(nick,code);render();});
      c.on('data',m=>{if(ON&&ON.conn===c&&!c.dead){ON.lastRx=Date.now();clientMsg(m);}});
      c.on('close',()=>{clearTimeout(to);if(ON&&ON.conn===c&&!c.dead)clientDown();});
    });
    p.on('error',e=>{if(!ON||ON.peer!==p)return;onFail(e.type==='peer-unavailable'?'Stanza non trovata.':'Errore di rete ('+e.type+').');});
  });
}
function clientDown(){
  if(!ON||ON.role!=='client'||ON.state==='menu'||ON.state==='ended')return;
  if(ON.conn)ON.conn.dead=true;
  if(ON.state!=='reconnecting'){ON.back=ON.state==='waiting'?'waiting':'playing';ON.state='reconnecting';ON.since=Date.now();}
  render();scheduleRc(2000);
}
function scheduleRc(ms){clearTimeout(ON.rt);ON.rt=setTimeout(tryRc,ms);}
function tryRc(){
  if(!ON||ON.state!=='reconnecting')return;
  if(Date.now()-ON.since>900000){onFail('Connessione persa.');return;}
  if(ON.conn)ON.conn.dead=true;ON.conn=null;try{ON.peer&&ON.peer.destroy();}catch(e){}
  const p=newPeer();ON.peer=p;
  p.on('open',()=>{
    if(!ON||ON.peer!==p)return;
    const c=p.connect(PFX+ON.code,{reliable:true,serialization:'json'});ON.conn=c;
    c.on('open',()=>{c.send({t:'hello',nick:ON.nick});});
    c.on('data',m=>{if(ON&&ON.conn===c&&!c.dead){ON.lastRx=Date.now();clientMsg(m);}});
    c.on('close',()=>{if(ON&&ON.conn===c&&!c.dead)clientDown();});
    scheduleRc(9000);
  });
  p.on('error',()=>{if(ON&&ON.peer===p)scheduleRc(3000);});
}
function clientMsg(m){
  if(!ON||ON.role!=='client')return;
  if(ON.state==='reconnecting'&&(m.t==='st'||m.t==='turn'||m.t==='lobby')){clearTimeout(ON.rt);ON.state=ON.back||'playing';}
  if(m.t==='pong')return;
  if(m.t==='reject'){onFail(m.why);return;}
  if(m.t==='lobby'){ON.players=m.players;ON.state='waiting';render();return;}
  if(m.t==='card'||m.t==='empty'){
    ON.wd=false;if(!G||G.turn!==0||G.phase!=='draw')return;
    if(m.t==='empty'){endRound(-1);return;}
    H().hand.push(m.c);G.newId=m.c.id;G.phase='play';G.discard=m.disc;G.stock=new Array(m.n).fill(0);
    say('Hai pescato '+cs(m.c)+'. Cala, attacca o scarta.');render();return;
  }
  if(m.t==='turn'||m.t==='st'){
    ON.wd=false;
    const g=m.g,old=(G&&G.players&&G.players[0].hand)?G.players[0].hand.map(c=>c.id):[];
    g.sel=new Set();OPT.rule=m.opt.rule;if(g.over)lastDrop();
    const idx=new Map(old.map((id,i)=>[id,i]));let unk=0;
    const hand=g.players[0].hand.map((c,i)=>{if(!idx.has(c.id))unk++;return[idx.has(c.id)?idx.get(c.id):1e6+i,c];}).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    g.players[0].hand=hand;
    ON.applying=true;G=g;ON.state='playing';
    if(unk>hand.length/2)sortHand();
    if(m.t==='turn')startTurn();else render();
    ON.applying=false;
  }
}
function sendUpd(extra){
  if(!ON||!ON.conn||!G)return;
  if(!ON.conn.open){clientDown();return;}
  try{ON.conn.send(Object.assign({t:'upd',g:{players:[{hand:G.players[0].hand,opened:G.players[0].opened}],discard:G.discard,melds:G.melds,taken:G.taken,turn:G.turn}},extra||{}));}catch(e){}
}
function netHook(){
  if(!ON||ON.applying||ON.state!=='playing'||!G)return;
  if(ON.role==='host'){clearTimeout(ON.bt);ON.bt=setTimeout(bcast,40);}
  else if(G.turn===0&&G.phase!=='wait'&&G.phase!=='roundEnd'){clearTimeout(ON.ct);ON.ct=setTimeout(()=>sendUpd(),40);}
}
async function wake(){try{if(navigator.wakeLock&&ON&&ON.state!=='menu'&&ON.state!=='ended'){ON.wlk=await navigator.wakeLock.request('screen');}}catch(e){}}
function netWake(){
  if(!ON)return;wake();
  if(ON.role==='host'&&ON.peer&&ON.state!=='menu'){if(ON.peer.destroyed)mkPeer(ON.code);else if(ON.peer.disconnected){try{ON.peer.reconnect();}catch(e){}}}
  if(ON.role==='client'&&ON.state==='reconnecting')tryRc();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)netWake();});
async function onAct(a){
  const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
  if(a==='online'){ON={state:'menu',nick:getNick(),key:getKey(),code:'',err:''};render();return;}
  if(a==='oback'){leaveOnline();render();return;}
  if(a==='ocreate'){const n=val('nick'),k=val('key');ON.key=k;ON.nick=n;if(!n){ON.err='Scrivi il tuo nome.';render();return;}if(!(await okKey(k))){ON.err='Parola d\'accesso errata.';render();return;}setNick(n);setKey(k);onHost(n);return;}
  if(a==='ojoin'){const n=val('nick'),c=val('code').toUpperCase(),k=val('key');ON.nick=n;ON.code=c;ON.key=k;if(!n||c.length<4){ON.err='Scrivi nome e codice stanza.';render();return;}if(!(await okKey(k))){ON.err='Parola d\'accesso errata.';render();return;}setNick(n);setKey(k);onJoin(n,c);return;}
  if(a==='oresume'){const sv=hostLoad(),k=val('key');if(!sv){ON.err='Nessuna partita salvata.';render();return;}if(!(await okKey(k))){ON.err='Parola d\'accesso errata.';render();return;}setKey(k);onHost(sv.nicks[0],sv);return;}
  if(a==='odrop'){hostDrop();render();return;}
  if(a==='olast'){lastDrop();render();return;}
  if(a==='orejoin'){const l=lastLoad(),k=val('key');if(!l){ON.err='Nessuna stanza ricordata.';render();return;}if(!(await okKey(k))){ON.err='Parola d\'accesso errata.';render();return;}setKey(k);setNick(l.nick);onJoin(l.nick,l.code);return;}
  if(a==='onet'){OPT.net=NEXTNET[OPT.net]||'p2p';try{localStorage.setItem('scala40opt',JSON.stringify(OPT));}catch(e){}if(ON){ON.nick=val('nick')||ON.nick;ON.key=val('key')||ON.key;}render();return;}
  if(a==='oseats'){ON.seats=ON.seats>=6?Math.max(2,ON.nicks.length):ON.seats+1;if(ON.seats<ON.nicks.length)ON.seats=ON.nicks.length;render();return;}
  if(a==='ograce'){ON.grace={1:3,3:5,5:10,10:1}[ON.grace]||3;render();return;}
  if(a==='ostart'){onStart();return;}
  if(a==='oshare'){const url=inviteUrl(),txt='Giochiamo a Scala 40! Apri: '+url+' → 🌐 Gioca online → Entra nella stanza. Codice stanza: '+ON.code+'. La parola d\'accesso te la do io.';
    if(navigator.share){navigator.share({title:'Scala 40',text:txt}).catch(()=>{});}else window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');return;}
}

render();
let UPD=false;function tryUpd(){if(UPD&&!G){UPD=false;location.reload();return true;}return false;}
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had)return;UPD=true;if(!tryUpd())render();});}catch(e){}});}
</script>
